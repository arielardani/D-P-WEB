<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SIMPUS-Mini - Tambah Buku</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>

    <header>
        <h1>SIMPUS-Mini</h1>

        <button type="button" id="nav-toggle-btn" class="nav-toggle-label">
            ☰
        </button>

        <nav>
            <ul>
                <li><a href="../index.html">Dashboard</a></li>
                <li><a href="list.html">Buku</a></li>
                <li><a href="../anggota/list.html">Anggota</a></li>
            </ul>
        </nav>
    </header>

    <main>

        <section>
            <h2>Tambah Data Buku</h2>

            <form id="form-tambah">

                <label for="judul">Judul Buku</label>
                <input type="text" id="judul" name="judul" placeholder="Masukkan judul buku">

                <label for="penulis">Penulis</label>
                <input type="text" id="penulis" name="penulis" placeholder="Masukkan nama penulis">

                <label for="penerbit">Penerbit</label>
                <input type="text" id="penerbit" name="penerbit" placeholder="Masukkan nama penerbit">

                <label for="tahun">Tahun Terbit</label>
                <input type="number" id="tahun" name="tahun" placeholder="Contoh: 2024">

                <label for="kategori">Kategori</label>
                <select id="kategori" name="kategori">
                    <option value="">-- Pilih Kategori --</option>
                    <option value="teknologi">Teknologi</option>
                    <option value="pemrograman">Pemrograman</option>
                    <option value="novel">Novel</option>
                    <option value="pendidikan">Pendidikan</option>
                </select>

                <button type="submit">Simpan</button>
                <a href="list.html">Batal</a>

            </form>
        </section>

    </main>

    <footer>
        <p>&copy; 2026 SIMPUS-Mini</p>
    </footer>
    <script src="../assets/js/app.js"></script>
</body>

</html>
