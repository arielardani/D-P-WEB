<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SIMPUS-Mini - Data Buku</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>

    <header>
        <h1>SIMPUS-Mini</h1>

        <button type="button" id="nav-toggle-btn" class="nav-toggle-label">
            ☰
        </button>

        <nav>
            <ul>
                <li><a href="../index.html">Dashboard</a></li>
                <li><a href="list.html">Buku</a></li>
                <li><a href="../anggota/list.html">Anggota</a></li>
            </ul>
        </nav>
    </header>

    <main>


        <section>
            <h2>Daftar Buku</h2>

            <div class="search-box">
                <label for="search-input">Cari Buku</label>
                <input type="text" id="search-input" placeholder="Ketik judul atau penulis...">
            </div>

            <p id="loading-buku">Memuat data...</p>

            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Judul</th>
                            <th>Penulis</th>
                            <th>Tahun</th>
                            <th>Stok</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>

                    <tbody id="tabel-buku">
                    </tbody>
                </table>
            </div>
        </section>

    </main>

    <footer>
        <p>&copy; 2026 SIMPUS-Mini</p>
    </footer>
    <script src="../assets/js/app.js"></script>
    <script src="../assets/js/buku.js"></script>
</body>

</html>
