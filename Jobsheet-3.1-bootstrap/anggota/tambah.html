<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIMPUS-Mini | Tambah Anggota</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>
    <header class="navbar navbar-expand-lg navbar-dark" style="background-color: #1d5b8a;">
        <div class="container">
            <a class="navbar-brand fw-semibold" href="../index.html">SIMPUS-Mini</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu"
                aria-controls="navMenu" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <nav class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="../index.html">Beranda</a></li>
                    <li class="nav-item"><a class="nav-link" href="../buku/list.html">Daftar Buku</a></li>
                    <li class="nav-item"><a class="nav-link" href="../buku/tambah.html">Tambah Buku</a></li>
                    <li class="nav-item"><a class="nav-link" href="list.html">Daftar Anggota</a></li>
                    <li class="nav-item"><a class="nav-link active" href="tambah.html">Tambah Anggota</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container my-4">
        <section class="card shadow-sm col-md-8 mx-auto">
            <div class="card-body">
                <h2 class="card-title h4 mb-4" style="color: #1d5b8a;">Form Tambah Anggota</h2>

                <form action="list.html" method="get">
                    <div class="mb-3">
                        <label for="nim" class="form-label fw-semibold">NIM / ID Anggota</label>
                        <input type="text" id="nim" name="nim" class="form-control" placeholder="Masukkan NIM/ID" required>
                    </div>

                    <div class="mb-3">
                        <label for="nama" class="form-label fw-semibold">Nama Lengkap</label>
                        <input type="text" id="nama" name="nama" class="form-control" placeholder="Nama lengkap anggota" required>
                    </div>

                    <div class="mb-3">
                        <label for="prodi" class="form-label fw-semibold">Program Studi</label>
                        <select id="prodi" name="prodi" class="form-select" required>
                            <option value="">-- Pilih Program Studi --</option>
                            <option value="Teknik Informatika">Teknik Informatika</option>
                            <option value="Sistem Informasi">Sistem Informasi</option>
                            <option value="Teknik Komputer">Teknik Komputer</option>
                        </select>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn text-white" style="background-color: #1d5b8a;">Simpan</button>
                        <a href="list.html" class="btn btn-secondary">Batal</a>
                    </div>
                </form>
            </div>
        </section>
    </main>

    <footer class="container text-center py-3 border-top">
        <p class="text-muted mb-0">&copy; 2026 SIMPUS-Mini &mdash; Jobsheet 3 (Bootstrap)</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
